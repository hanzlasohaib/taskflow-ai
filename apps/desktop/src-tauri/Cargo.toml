[package]
name = "taskflow-desktop"
version = "0.8.0"
description = "TaskFlow desktop shell (Tauri webview)"
authors = ["TaskFlow"]
edition = "2021"

[lib]
name = "taskflow_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
url = "2"
